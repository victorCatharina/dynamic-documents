version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dynamic_docs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dynamic_docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dynamic_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dynamic_docs_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dynamic_docs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/dynamic_docs?schema=public"
      JWT_SECRET: "dynamic-documents-production-jwt-secret-key-32-chars-min"
      JWT_EXPIRES_IN: "1d"
      STORAGE_DRIVER: "s3"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_REGION: "us-east-1"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadminpassword"
      STORAGE_BUCKET: "documents"
      STORAGE_FORCE_PATH_STYLE: "true"
      MAX_FILE_SIZE: 10485760
      PUBLIC_FORM_BASE_URL: "http://localhost:5173/f"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
